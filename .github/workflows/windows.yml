name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run check
      - name: Build frontend
        run: node node_modules/vite/bin/vite.js build --outDir .audit-work/frontend-dist
      - name: Fetch locked Rust dependencies
        run: cargo fetch --manifest-path src-tauri/Cargo.toml --locked
      - name: Native tests, Clippy and formatting
        run: python scripts/run-safe-checks.py
      - name: Frontend and real Monaco regressions
        run: npm test
      - name: Verify publication allowlist
        run: python scripts/source-manifest.py
